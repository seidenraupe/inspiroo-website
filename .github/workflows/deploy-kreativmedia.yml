# Produktion www.inspiroo.ch: Build + FTPS/SFTP-Upload (wie hvw-website: push auf main).
# Secrets: FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_REMOTE_DIR; optional FTP_PORT=21, GA/Search Console.
name: Deploy KreativMedia (production)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_verify:
        description: SFTP-Test überspringen (nur bei manuellem Start)
        required: false
        type: boolean
        default: false
      promote_to_docroot:
        description: Dateien aus inspiroo.ch/… ins FTP-Dokumentenstamm verschieben (einmalig nach Pfad-Fix)
        required: false
        type: boolean
        default: true

concurrency:
  group: kreativmedia-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: KreativMedia-Zugang aus Secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: bash scripts/ci-kreativmedia-env.sh

      - name: SFTP-Verbindung prüfen
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.skip_verify != true
        run: npm run test:kreativmedia

      - name: FTP-Inhalt ins Dokumentenstamm verschieben (falls verschachtelt)
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.promote_to_docroot == true
        run: npm run promote:kreativmedia

      - name: Produktions-Build (out/, kein GitHub-Pfad)
        run: npm run build:production
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}

      - name: Auf KreativMedia hochladen
        run: node scripts/deploy-kreativmedia.mjs
