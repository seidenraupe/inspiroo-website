<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="banner.css" />
  <style>
    .banner { width: 1200px; height: 628px; }
    .photo {
      width: 540px;
      background-image: url("../../public/images/arbeitsgespraech-hell.webp");
      background-position: 60% center;
    }
    .content {
      position: absolute;
      left: 72px; top: 0; bottom: 0; width: 580px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .logo { width: 150px; margin-bottom: 40px; }
    .eyebrow { font-size: 14px; }
    .milestone {
      display: flex; align-items: baseline; gap: 10px;
      margin-top: 24px;
    }
    .milestone-num {
      font-size: 68px; font-weight: 700; letter-spacing: -0.04em;
      color: var(--cream); line-height: 1;
    }
    .milestone-label {
      font-size: 22px; font-weight: 400; color: color-mix(in srgb, var(--cream) 75%, transparent);
      max-width: 14ch; line-height: 1.3;
    }
    .divider { margin: 28px 0; width: 60px; height: 3px; background: var(--violet); }
    .claim { font-size: 36px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.12; max-width: 20ch; }
    .url { margin-top: 28px; font-size: 20px; font-weight: 600; color: var(--violet-light); }
  </style>
</head>
<body>
  <div class="banner">
    <div class="photo"></div>
    <div class="content">
      <img class="logo" src="../../public/inspiroo-logo.png" alt="" width="300" height="157" />
      <p class="eyebrow">Vier Jahre · Neue Website</p>
      <div class="milestone">
        <span class="milestone-num">30+</span>
        <span class="milestone-label">Jahre C-Level – 13 davon als CEO</span>
      </div>
      <div class="divider"></div>
      <h1 class="claim">Sparring auf Augenhöhe.<br />Für das, was im Alltag zählt.</h1>
      <p class="url">www.inspiroo.ch</p>
    </div>
  </div>
</body>
</html>
